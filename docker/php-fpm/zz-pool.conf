; php-fpm pool over unix socket (nginx and fpm in one container)
[global]
error_log = /proc/self/fd/2

[www]
listen = /run/php-fpm-www.sock
listen.owner = nginx
listen.group = nginx
user = www-data
group = www-data
catch_workers_output = yes
; keep docker-friendly defaults: dynamic pm, 10 children (runtime image default)
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3