server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;

    # Document root: replaced at container start from $DOCROOT
    root __DOCROOT__;
    index index.php index.html;

    # Slim apps (and CakePHP webroot) rely on these pretty URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP via the fpm unix socket in this same container
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php-fpm-www.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $fastcgi_https;
    }

    # Static assets: cache headers + gzip (parity with the Apache image's
    # expires + deflate setup)
    location ~* \.(jpe?g|png|gif|webp|svg|ico|css|js|mjs|woff2?|ttf|otf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/vnd.api+json;
    gzip_vary on;

    # Body size: matches the runtime image defaults (post 25M)
    client_max_body_size 25m;
}