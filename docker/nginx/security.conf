# Traefik/Dokploy proxy awareness (parity with themusicdev/php-apache)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# (server tokens: Alpine's nginx.conf already sets server_tokens off)

# Make PHP see HTTPS when Traefik terminates TLS (parity: SetEnvIf HTTPS=on)
map $http_x_forwarded_proto $fastcgi_https {
    default '';
    https on;
}