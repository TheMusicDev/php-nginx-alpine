; Sane defaults for a shared Apache+PHP runtime.
; Per-app overrides: copy/extend this or set ini via child image.
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
max_input_vars = 3000
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Build-time override hints (pass as ARG/ENV in a child Dockerfile,
; or docker run -e PHP_VALUE / PHP_ADMIN_VALUE):
;   PHP_VALUE="memory_limit=512M upload_max_filesize=64M"